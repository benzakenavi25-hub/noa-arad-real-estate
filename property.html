  <!-- Start loading the listing data at once, then preload its hero image (js/property.js reuses this fetch).
       It sits above the stylesheets on purpose: an inline script after a pending stylesheet waits for it. -->
  <script>
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    window.__properties = fetch('properties.json').then(function (r) {
      if (!r.ok) throw new Error('properties.json: ' + r.status);
      return r.json();
    });
    window.__properties.then(function (d) {
      var p = (d.forSale || []).concat(d.sold || []).filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      var n = p.image.replace(/\.(jpe?g|png)$/i, '');
      // Same choice as the hero <picture>: the portrait crop on portrait screens, the srcset otherwise.
      var add = function (media, attrs) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.media = media;
        l.setAttribute('fetchpriority', 'high');
        for (var k in attrs) l.setAttribute(k, attrs[k]);
        document.head.appendChild(l);
      };
      add('(max-aspect-ratio: 3/4)', { href: 'images/opt/' + n + '-portrait.webp' });
      add('(min-aspect-ratio: 3001/4000)', {   // just above 3:4, the complement of the portrait query
        imagesrcset: 'images/opt/' + n + '-768.webp 768w, images/opt/' + n + '-1280.webp 1280w, images/opt/' + n + '-2560.webp 2560w',
        imagesizes: '100vw'
      });
    }).catch(function () {});
  })();
  </script>
